name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to reconcile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install --global npm@12.0.2

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          node -e 'const { version } = require("./package.json");
          const expected = `v${version}`;
          if (process.env.RELEASE_TAG !== expected) {
            console.error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}`);
            process.exit(1);
          }'

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

      - name: Check whether this version already exists
        id: registry
        run: |
          package_spec=$(node -e 'const p = require("./package.json"); process.stdout.write(`${p.name}@${p.version}`)')
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$package_spec is already published; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage package for approval
        if: steps.registry.outputs.published != 'true'
        run: npm stage publish

  release:
    name: Create GitHub release
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or preserve release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.stage.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub release; nothing to do."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body > "$notes"
          node -e '
            const fs = require("node:fs");
            const path = process.argv[1];
            const tick = String.fromCharCode(96);
            const body = fs.readFileSync(path, "utf8").replace(
              /(^|[^\x60/])(@(?:worker(?:-[A-Za-z0-9_-]+)?|jujuleaf\/worker(?:@[0-9A-Za-z.-]+)?))(?![A-Za-z0-9_-])/gm,
              (_match, prefix, mention) => prefix + tick + mention + tick,
            );
            fs.writeFileSync(path, body);
          ' "$notes"
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "JujuLeaf Worker $RELEASE_TAG" --notes-file "$notes"
